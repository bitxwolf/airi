name: Update My PR Branches

on:
  schedule:
    # Runs every six hours at 00:00, 06:00, 12:00, and 18:00 UTC.
    # To change the schedule, edit the cron expression below.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-my-pr-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: moeru-ai/airi
  FORK_OWNER: ${{ github.repository_owner }}
  # GitHub CLI uses GH_TOKEN for authentication.
  # Use a personal access token if you need to update pull requests across repositories.
  # If a personal access token secret is set, this workflow uses it.
  # Otherwise, it falls back to GITHUB_TOKEN.
  GH_TOKEN: ${{ secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}

jobs:
  update-branches:
    name: Update open PR branches
    runs-on: ubuntu-latest
    steps:
      - name: Update PR branches
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "Updating open PR branches from upstream base"
          echo "Upstream Repository: ${UPSTREAM_REPO}"
          echo "Fork Owner / Author: ${FORK_OWNER}"
          echo "============================================================"

          if ! gh auth status >/dev/null 2>&1; then
            echo "::error::GitHub CLI is not authenticated. Check GH_TOKEN."
            exit 1
          fi

          echo "Searching for open PRs in ${UPSTREAM_REPO} authored by ${FORK_OWNER}..."
          PRS_JSON=$(gh pr list \
            --repo "${UPSTREAM_REPO}" \
            --author "${FORK_OWNER}" \
            --state open \
            --limit 200 \
            --json number,title,headRefName,headRepositoryOwner,baseRefName,author)

          MATCHING_PRS=$(echo "${PRS_JSON}" | jq -c --arg owner "${FORK_OWNER}" '
            [ .[] | select(
              (.author.login | ascii_downcase) == ($owner | ascii_downcase) and
              (.headRepositoryOwner.login | ascii_downcase) == ($owner | ascii_downcase)
            ) ]
          ')

          TOTAL_PRS=$(echo "${MATCHING_PRS}" | jq 'length')
          echo "Found ${TOTAL_PRS} open PR(s) matching author and head fork '${FORK_OWNER}'."

          if [ "${TOTAL_PRS}" -eq 0 ]; then
            echo "No matching open pull requests found. Nothing to update."
            exit 0
          fi

          UPDATED_COUNT=0
          UP_TO_DATE_COUNT=0
          FAILED_COUNT=0
          declare -a FAILED_ITEMS=()

          TMP_PRS_FILE=$(mktemp)
          echo "${MATCHING_PRS}" | jq -c '.[]' > "${TMP_PRS_FILE}"

          while IFS= read -r pr; do
            [ -z "$pr" ] && continue

            PR_NUMBER=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            BASE_REF=$(echo "$pr" | jq -r '.baseRefName')
            HEAD_REF=$(echo "$pr" | jq -r '.headRefName')
            HEAD_OWNER=$(echo "$pr" | jq -r '.headRepositoryOwner.login')

            echo ""
            echo "------------------------------------------------------------"
            echo "Processing PR #${PR_NUMBER}: ${PR_TITLE}"
            echo "  Base: ${BASE_REF} | Head: ${HEAD_OWNER}:${HEAD_REF}"

            COMPARE_PATH="/repos/${UPSTREAM_REPO}/compare/${BASE_REF}...${HEAD_OWNER}:${HEAD_REF}"
            COMPARE_RES=""
            if ! COMPARE_RES=$(gh api "$COMPARE_PATH" 2>&1); then
              echo "::warning::PR #${PR_NUMBER} - Failed to compare branch against base: ${COMPARE_RES}"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_ITEMS+=("PR #${PR_NUMBER} (${PR_TITLE}): compare call failed - ${COMPARE_RES}")
              continue
            fi

            BEHIND_BY=$(echo "$COMPARE_RES" | jq -r '.behind_by // empty')
            if [ -z "$BEHIND_BY" ]; then
              echo "::warning::PR #${PR_NUMBER} - Could not determine commit count behind base."
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_ITEMS+=("PR #${PR_NUMBER} (${PR_TITLE}): missing behind_by in compare response")
              continue
            fi

            if [ "$BEHIND_BY" -eq 0 ]; then
              echo "  Status: Up to date with ${BASE_REF} (behind by 0 commits). No action needed."
              UP_TO_DATE_COUNT=$((UP_TO_DATE_COUNT + 1))
              continue
            fi

            echo "  Status: Behind ${BASE_REF} by ${BEHIND_BY} commit(s). Updating PR branch..."

            UPDATE_RES=""
            if UPDATE_RES=$(gh pr update-branch "$PR_NUMBER" --repo "$UPSTREAM_REPO" 2>&1); then
              echo "  Success: Updated PR #${PR_NUMBER} from base branch '${BASE_REF}'."
              UPDATED_COUNT=$((UPDATED_COUNT + 1))
            else
              echo "::error::PR #${PR_NUMBER} - Failed to update branch: ${UPDATE_RES}"
              if [[ "$UPDATE_RES" =~ "403" || "$UPDATE_RES" =~ "permission" || "$UPDATE_RES" =~ "Resource not accessible" ]]; then
                echo "::notice::PR #${PR_NUMBER} permission error: updating fork PRs against upstream requires a personal access token with repo/contents write access configured in repository secrets (such as secrets.GH_PAT)."
              elif [[ "$UPDATE_RES" =~ "conflict" || "$UPDATE_RES" =~ "422" ]]; then
                echo "::notice::PR #${PR_NUMBER} has merge conflicts with base branch '${BASE_REF}'. Manual resolution is required."
              fi
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_ITEMS+=("PR #${PR_NUMBER} (${PR_TITLE}): ${UPDATE_RES}")
            fi
          done < "${TMP_PRS_FILE}"

          rm -f "${TMP_PRS_FILE}"

          echo ""
          echo "============================================================"
          echo "Execution Summary:"
          echo "  Total matching PRs:     ${TOTAL_PRS}"
          echo "  Already up to date:     ${UP_TO_DATE_COUNT}"
          echo "  Successfully updated:   ${UPDATED_COUNT}"
          echo "  Failed to update:       ${FAILED_COUNT}"
          echo "============================================================"

          if [ "${FAILED_COUNT}" -gt 0 ]; then
            echo ""
            echo "Failed PRs breakdown:"
            for item in "${FAILED_ITEMS[@]}"; do
              echo "  * ${item}"
            done
            exit 1
          fi
